<!DOCTYPE html>
<html>
<head>
  <title>Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    // CSRF token and swagger spec are injected server-side at render time.
    // Using spec: (inline) instead of url: avoids any static file serving
    // issues — the OpenAPI JSON is embedded directly in this page.
    var csrfToken = "{{ csrf_token or '' }}";
    var swaggerSpec = {{ swagger_spec | tojson }};

    window.onload = function () {
      const ui = SwaggerUIBundle({
        spec: swaggerSpec,
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        persistAuthorization: true,
        docExpansion: "none",
        requestInterceptor: function (request) {
          if (csrfToken && request.method !== "GET") {
            request.headers["X-Frappe-CSRF-Token"] = csrfToken;
          }
          return request;
        },
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
